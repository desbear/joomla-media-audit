PLG_CONSOLE_MEDIAAUDIT="Console - Media Audit"
PLG_CONSOLE_MEDIAAUDIT_XML_DESCRIPTION="Command line tools of Media Audit: mediaaudit:scan and mediaaudit:check-broken."
PLG_CONSOLE_MEDIAAUDIT_SCAN_DESC="Scans the images and the content, and reports orphaned, broken and duplicated images"
PLG_CONSOLE_MEDIAAUDIT_SCAN_HELP="<info>%command.name%</info> indexes the images below images/ and the references to them in the content of the site, and prints the report.\n\nNo file is changed, moved or deleted.\n\n  <info>php %command.full_name%</info>\n  <info>php %command.full_name% --no-hash --format=json</info>\n  <info>php %command.full_name% --report-only --prefix=images/banners/</info>"
PLG_CONSOLE_MEDIAAUDIT_SCAN_OPT_NO_HASH="Do not compute the SHA-1 of the files. Faster, but finds no duplicates among new files."
PLG_CONSOLE_MEDIAAUDIT_SCAN_OPT_FORMAT="Format of the report: table, json or csv"
PLG_CONSOLE_MEDIAAUDIT_SCAN_OPT_PREFIX="Report paths that start with this only"
PLG_CONSOLE_MEDIAAUDIT_SCAN_OPT_LIMIT="Rows of every list in the table format. 0 for all."
PLG_CONSOLE_MEDIAAUDIT_SCAN_OPT_REPORT_ONLY="Print the report of the last scan, without scanning"
PLG_CONSOLE_MEDIAAUDIT_SCAN_ERR_FORMAT="Unknown format. Use one of: %s"
PLG_CONSOLE_MEDIAAUDIT_SCAN_STEP="Scanning: %s"
PLG_CONSOLE_MEDIAAUDIT_SCAN_TITLE="Media Audit: %s"
PLG_CONSOLE_MEDIAAUDIT_SCAN_DONE="Scanned in %1$s seconds: %2$d files, %3$d references."
PLG_CONSOLE_MEDIAAUDIT_SCAN_MORE="… and %d more. Use --limit=0 or --format=csv for all of them."
PLG_CONSOLE_MEDIAAUDIT_SCAN_NOTE="The report only knows the references in the content of this site. A file that is linked from elsewhere looks like an orphan."
