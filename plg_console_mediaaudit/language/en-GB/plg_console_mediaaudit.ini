PLG_CONSOLE_MEDIAAUDIT_CHECK_DESC="Looks for broken images: local files that are missing, and external images that do not answer"
PLG_CONSOLE_MEDIAAUDIT_CHECK_HELP="<info>%command.name%</info> checks the references of the last scan.\n\nLocal references are compared with the files on disk. External references are only checked with --external, or when the option of the component is on: every URL costs a request to another site.\n\n  <info>php %command.full_name%</info>\n  <info>php %command.full_name% --external --host=www.example.com --recheck-days=7</info>"
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_EXTERNAL="Check external URLs too, whatever the option of the component says"
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_HOST="Check the URLs of this host only. Can be given several times."
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_LIMIT="Check at most this many URLs. 0 for all."
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_RECHECK="Leave out the URLs that were checked in the last days. 0 to check all."
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_CONCURRENCY="Requests at the same time, to different hosts"
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_TIMEOUT="Seconds to wait for an answer"
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_DELAY="Milliseconds between two requests to the same host"
PLG_CONSOLE_MEDIAAUDIT_CHECK_ERR_CURL="The curl extension of PHP is needed to ask other sites."
PLG_CONSOLE_MEDIAAUDIT_CHECK_TITLE="Media Audit: broken images"
PLG_CONSOLE_MEDIAAUDIT_CHECK_LOCAL="Missing files below %1$s (%2$d)"
PLG_CONSOLE_MEDIAAUDIT_CHECK_HOSTS="External images by host"
PLG_CONSOLE_MEDIAAUDIT_CHECK_DONE="Checked %1$d URLs in %2$s seconds: %3$d fine, %4$d broken, %5$d without answer."
PLG_CONSOLE_MEDIAAUDIT_CHECK_EXTERNAL="External images that are broken (%d)"
PLG_CONSOLE_MEDIAAUDIT_CHECK_NOTE_OFF="External URLs were not checked. Use --external, or switch on \"Check external URLs\" in the options of the component."
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_DESC="Copies external images to this site, and makes the content load the copies"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_HELP="<info>%command.name%</info> downloads the images that the content loads from other sites to a folder below images/, and replaces their URLs in the content by the paths of the copies.\n\nThe text that a column had is kept, and --revert puts it back. No file is overwritten or deleted.\n\nThe hosts come from --host, or from the options of the component. Run mediaaudit:scan first.\n\n  <info>php %command.full_name% --host=faq.example.com --dry-run</info>\n  <info>php %command.full_name% --host=faq.example.com</info>\n  <info>php %command.full_name% --revert</info>"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_HOST="Copy the images of this host. Can be given several times."
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_ALL_HOSTS="Copy the images of every host"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_FOLDER="Folder of the copies, below images/"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_LIMIT="Download at most this many images. 0 for all."
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_DELAY="Milliseconds between two downloads"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_DRY_RUN="Only tell what would be done"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_DOWNLOAD_ONLY="Download, but leave the content as it is"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_REWRITE_ONLY="Do not download; use the copies that are there"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_REVERT="Put back the text that the content had before it was rewritten"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_TITLE="Media Audit: local copies of external images"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_DRY_RUN="dry run, nothing is changed"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_HOSTS="Hosts: %1$s. Folder: %2$s"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_ERR_HOSTS="Say which hosts to copy from: --host=faq.example.com, --all-hosts, or the option of the component."
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_ERR_FOLDER="The folder of the copies has to be below images/."
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_DOWNLOADED="%1$d images without a copy: %2$d downloaded, %3$d the same as a copy that was there, %4$d failed. %5$s MB in %6$s seconds."
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_WOULD_DOWNLOAD="%1$d images have no copy yet and would be downloaded."
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_REWRITTEN="Rewritten: %1$d sources, %2$d URLs replaced. %3$d sources are of a kind that cannot be rewritten."
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_WOULD_REWRITE="Would rewrite %1$d sources and replace %2$d URLs, with the copies that are there now. %3$d sources are of a kind that cannot be rewritten."
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_REVERTED="%1$d columns put back. %2$d were edited since and left alone, %3$d are gone."
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_NOTE_REVERT="The text that was replaced is kept. To put it back: php cli/joomla.php mediaaudit:localize --revert"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_RETRY="Try again what could not be copied in the last 7 days"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_DESC="Takes external images that are lost out of the content, and leaves a note in their place"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_HELP="<info>%command.name%</info> replaces the images of a host that do not answer with an image, and have no local copy, by a note.\n\nThe images are checked once more right before. The text that a column had is kept, and mediaaudit:localize --revert puts it back. No file is touched.\n\n  <info>php %command.full_name% --host=old.example.com --dry-run</info>\n  <info>php %command.full_name% --host=old.example.com --text=\"Image lost\"</info>"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_OPT_HOST="Host whose lost images are taken out. Needed; can be given several times."
PLG_CONSOLE_MEDIAAUDIT_REMOVE_OPT_TEXT="The note that takes the place of the image"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_OPT_NO_RECHECK="Trust the last check, and do not ask the host again"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_TEXT="Image lost"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_TITLE="Media Audit: lost images"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_ERR_HOST="Say whose images: --host=old.example.com. There is no way to take out the lost images of every host at once."
PLG_CONSOLE_MEDIAAUDIT_REMOVE_RECHECKED="Asked %1$s again: %2$d URLs, %3$d fine, %4$d broken, %5$d without answer."
PLG_CONSOLE_MEDIAAUDIT_REMOVE_DONE="%1$d images are lost. %2$d images were replaced by the note \"%4$s\" in %3$d sources."
PLG_CONSOLE_MEDIAAUDIT_REMOVE_WOULD="%1$d images are lost. %2$d images would be replaced by the note \"%4$s\" in %3$d sources."
PLG_CONSOLE_MEDIAAUDIT_CONVERT_DESC="Converts the JPEG and PNG images that content refers to to AVIF or WebP, and makes the content load the new files"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_HELP="The converted file is written next to the image, which is not changed and not deleted. A new file that is not smaller is not used.\nFormat and quality come from the options of the component. --revert puts the content back; the converted files stay."
PLG_CONSOLE_MEDIAAUDIT_CONVERT_TITLE="Media Audit image conversion"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_FORMAT="avif or webp. The format of the options of the component by default"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_QUALITY="Quality, 1 to 100. The one of the options of the component by default"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_LIMIT="The most images to convert. 0 for all"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_DRY_RUN="Only count; write no file and no content"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_CONVERT_ONLY="Only convert the images; leave the content"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_REWRITE_ONLY="Only make the content load the files that were converted before"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_REVERT="Put back the content that was rewritten for converted images"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_ERR_FORMAT="No format. Use --format=avif or --format=webp, or choose one in the options of the component."
PLG_CONSOLE_MEDIAAUDIT_CONVERT_ERR_ENCODER="This server cannot write %s. Use the other format, or name the path of a program in the options of the component."
PLG_CONSOLE_MEDIAAUDIT_CONVERT_WOULD_CONVERT="%1$d images would be converted to %8$s, quality %9$d."
PLG_CONSOLE_MEDIAAUDIT_CONVERT_CONVERTED="%1$d images: %2$d converted, %3$d not smaller, %4$d failed. %5$s MB became %6$s MB, in %7$s seconds. Format %8$s, quality %9$d."
PLG_CONSOLE_MEDIAAUDIT_CONVERT_NOTE_REVERT="To put the content back: php cli/joomla.php mediaaudit:convert --revert"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_NOTE_FILES="The converted files are still next to the images. When no content refers to them, they show in the list of orphans."
