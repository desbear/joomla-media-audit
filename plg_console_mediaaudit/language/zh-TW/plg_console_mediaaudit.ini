PLG_CONSOLE_MEDIAAUDIT_CHECK_DESC="找出掉圖：不存在的本機檔案，以及沒有回應的外部圖片"
PLG_CONSOLE_MEDIAAUDIT_CHECK_HELP="<info>%command.name%</info> 檢查上次掃描得到的引用。\n\n站內引用會和磁碟上的檔案比對。外部引用只有加上 --external，或元件選項開啟時才會檢查，因為每個網址都要對別的網站送出一次要求。\n\n  <info>php %command.full_name%</info>\n  <info>php %command.full_name% --external --host=www.example.com --recheck-days=7</info>"
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_EXTERNAL="不管元件選項，一併檢查外部網址"
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_HOST="只檢查這個網域的網址，可以重複指定"
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_LIMIT="最多檢查幾個網址，0 為全部"
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_RECHECK="略過最近幾天內檢查過的網址，0 為全部重新檢查"
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_CONCURRENCY="同時送出的要求數（對不同網域）"
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_TIMEOUT="等待回應的秒數"
PLG_CONSOLE_MEDIAAUDIT_CHECK_OPT_DELAY="對同一個網域兩次要求之間的毫秒數"
PLG_CONSOLE_MEDIAAUDIT_CHECK_ERR_CURL="需要 PHP 的 curl 擴充套件才能連到其他網站。"
PLG_CONSOLE_MEDIAAUDIT_CHECK_TITLE="Media Audit：掉圖"
PLG_CONSOLE_MEDIAAUDIT_CHECK_LOCAL="%1$s 底下不存在的檔案（%2$d）"
PLG_CONSOLE_MEDIAAUDIT_CHECK_HOSTS="各網域的外部圖片"
PLG_CONSOLE_MEDIAAUDIT_CHECK_DONE="檢查了 %1$d 個網址，花了 %2$s 秒：%3$d 個正常、%4$d 個掉圖、%5$d 個沒有回應。"
PLG_CONSOLE_MEDIAAUDIT_CHECK_EXTERNAL="掉圖的外部圖片（%d）"
PLG_CONSOLE_MEDIAAUDIT_CHECK_NOTE_OFF="沒有檢查外部網址。請加上 --external，或在元件選項開啟「檢查外部網址」。"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_DESC="把外部圖片複製到本站，並讓內容改為載入複本"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_HELP="<info>%command.name%</info> 會把內容從其他網站載入的圖片下載到 images/ 底下的資料夾，並把內容裡的網址換成複本的路徑。\n\n欄位原本的文字會保留，用 --revert 可以還原。不會覆寫或刪除任何檔案。\n\n網域來自 --host 或元件選項。請先執行 mediaaudit:scan。\n\n  <info>php %command.full_name% --host=faq.example.com --dry-run</info>\n  <info>php %command.full_name% --host=faq.example.com</info>\n  <info>php %command.full_name% --revert</info>"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_HOST="複製這個網域的圖片，可以重複指定"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_ALL_HOSTS="複製所有網域的圖片"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_FOLDER="複本的資料夾，必須在 images/ 底下"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_LIMIT="最多下載幾張，0 為全部"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_DELAY="兩次下載之間的毫秒數"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_DRY_RUN="只說明會做什麼，不實際執行"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_DOWNLOAD_ONLY="只下載，不更動內容"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_REWRITE_ONLY="不下載，使用已有的複本"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_REVERT="把內容還原成改寫前的文字"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_TITLE="Media Audit：外部圖片的本地複本"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_DRY_RUN="試跑，不會更動任何東西"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_HOSTS="網域：%1$s。資料夾：%2$s"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_ERR_HOSTS="請指定要複製的網域：--host=faq.example.com、--all-hosts，或在元件選項填寫。"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_ERR_FOLDER="複本的資料夾必須在 images/ 底下。"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_DOWNLOADED="%1$d 張圖還沒有複本：下載了 %2$d 張、%3$d 張和已有的複本相同、%4$d 張失敗。共 %5$s MB，花了 %6$s 秒。"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_WOULD_DOWNLOAD="%1$d 張圖還沒有複本，會被下載。"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_REWRITTEN="已改寫 %1$d 個來源，換掉 %2$d 個網址。%3$d 個來源的類型無法改寫。"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_WOULD_REWRITE="以目前已有的複本，會改寫 %1$d 個來源、換掉 %2$d 個網址。%3$d 個來源的類型無法改寫。"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_REVERTED="還原了 %1$d 個欄位。%2$d 個在改寫後被編輯過，沒有更動；%3$d 個已經不存在。"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_NOTE_REVERT="被換掉的文字有保留。還原指令：php cli/joomla.php mediaaudit:localize --revert"
PLG_CONSOLE_MEDIAAUDIT_LOCALIZE_OPT_RETRY="重新嘗試最近 7 天內複製失敗的圖片"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_DESC="把遺失的外部圖片從內容移除，原位置留下說明文字"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_HELP="<info>%command.name%</info> 把某個網域中沒有回應圖片、也沒有本地複本的圖片，換成一段說明文字。\n\n執行前會再檢查一次。欄位原本的文字會保留，用 mediaaudit:localize --revert 可以還原。不會動到任何檔案。\n\n  <info>php %command.full_name% --host=old.example.com --dry-run</info>\n  <info>php %command.full_name% --host=old.example.com --text=\"原圖遺失\"</info>"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_OPT_HOST="要移除遺失圖片的網域。必填，可以重複指定。"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_OPT_TEXT="取代圖片的說明文字"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_OPT_NO_RECHECK="沿用上次檢查的結果，不再向該網域確認"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_TEXT="原圖遺失"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_TITLE="Media Audit：遺失的圖片"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_ERR_HOST="請指定網域：--host=old.example.com。沒有辦法一次移除所有網域的遺失圖片。"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_RECHECKED="重新確認 %1$s：%2$d 個網址，%3$d 個正常、%4$d 個掉圖、%5$d 個沒有回應。"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_DONE="有 %1$d 張圖遺失。在 %3$d 個來源中，把 %2$d 張圖換成了「%4$s」。"
PLG_CONSOLE_MEDIAAUDIT_REMOVE_WOULD="有 %1$d 張圖遺失。會在 %3$d 個來源中，把 %2$d 張圖換成「%4$s」。"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_DESC="把有內容引用的 JPEG 與 PNG 轉成 AVIF 或 WebP，並讓內容改為載入新檔"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_HELP="轉換後的檔案放在原圖旁邊，原圖不會被更動或刪除。新檔沒有比原圖小就不採用。\n格式與品質預設取自元件的選項。--revert 把內容還原成改寫前，轉換好的檔案會留著。"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_TITLE="Media Audit 圖片轉換"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_FORMAT="avif 或 webp。預設用元件選項裡的格式"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_QUALITY="品質，1 到 100。預設用元件選項裡的值"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_LIMIT="最多轉換幾張，0 表示全部"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_DRY_RUN="只計算，不寫入任何檔案或內容"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_CONVERT_ONLY="只轉換圖片，不改寫內容"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_REWRITE_ONLY="只把內容改為載入已經轉換好的檔案"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_OPT_REVERT="把因為轉換而改寫的內容還原"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_ERR_FORMAT="沒有指定格式。請用 --format=avif 或 --format=webp，或在元件選項裡選擇。"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_ERR_ENCODER="這台伺服器無法寫入 %s。請改用另一種格式，或在元件選項裡指定編碼程式的路徑。"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_WOULD_CONVERT="會轉換 %1$d 張圖片，格式 %8$s，品質 %9$d。"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_CONVERTED="%1$d 張圖片：轉換 %2$d 張，沒有比較小 %3$d 張，失敗 %4$d 張。%5$s MB 變成 %6$s MB，花了 %7$s 秒。格式 %8$s，品質 %9$d。"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_NOTE_REVERT="要把內容還原成改寫前：php cli/joomla.php mediaaudit:convert --revert"
PLG_CONSOLE_MEDIAAUDIT_CONVERT_NOTE_FILES="轉換好的檔案還在原圖旁邊。沒有內容引用之後，它們會出現在「孤兒」清單。"
