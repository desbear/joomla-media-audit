PLG_CONSOLE_MEDIAAUDIT="主控台 - Media Audit"
PLG_CONSOLE_MEDIAAUDIT_XML_DESCRIPTION="Media Audit 的命令列工具：mediaaudit:scan 與 mediaaudit:check-broken。"
PLG_CONSOLE_MEDIAAUDIT_SCAN_DESC="掃描圖片與內容，列出孤兒、掉圖與重複的圖片"
PLG_CONSOLE_MEDIAAUDIT_SCAN_HELP="<info>%command.name%</info> 會建立 images/ 底下圖片與站內內容引用的索引，並印出報表。\n\n不會變更、搬移或刪除任何檔案。\n\n  <info>php %command.full_name%</info>\n  <info>php %command.full_name% --no-hash --format=json</info>\n  <info>php %command.full_name% --report-only --prefix=images/banners/</info>"
PLG_CONSOLE_MEDIAAUDIT_SCAN_OPT_NO_HASH="不計算檔案的 SHA-1。比較快，但新檔案找不出重複檔。"
PLG_CONSOLE_MEDIAAUDIT_SCAN_OPT_FORMAT="報表格式：table、json 或 csv"
PLG_CONSOLE_MEDIAAUDIT_SCAN_OPT_PREFIX="只列出以此開頭的路徑"
PLG_CONSOLE_MEDIAAUDIT_SCAN_OPT_LIMIT="table 格式中每個清單的列數，0 為全部"
PLG_CONSOLE_MEDIAAUDIT_SCAN_OPT_REPORT_ONLY="不掃描，只印出上次掃描的報表"
PLG_CONSOLE_MEDIAAUDIT_SCAN_ERR_FORMAT="不認得的格式，請使用：%s"
PLG_CONSOLE_MEDIAAUDIT_SCAN_STEP="掃描中：%s"
PLG_CONSOLE_MEDIAAUDIT_SCAN_TITLE="Media Audit：%s"
PLG_CONSOLE_MEDIAAUDIT_SCAN_DONE="掃描花了 %1$s 秒：%2$d 個檔案、%3$d 個引用。"
PLG_CONSOLE_MEDIAAUDIT_SCAN_MORE="……還有 %d 筆。用 --limit=0 或 --format=csv 可以看到全部。"
PLG_CONSOLE_MEDIAAUDIT_SCAN_NOTE="報表僅依站內內容的引用判斷。從別處連結的檔案，看起來會像孤兒。"
