PLG_TASK_MEDIAAUDIT_CONVERT_LIMIT_DESC="從最大的圖片開始，其餘的留到下次執行。AVIF 一張大圖可能要幾秒；如果排程是靠訪客瀏覽觸發而不是 cron，請設小一點。"
PLG_TASK_MEDIAAUDIT_MAIL_CONVERTED="圖片轉換：%1$d 張轉成 %2$s，%3$s MB 變成 %4$s MB。%5$d 張轉換後沒有比較小，%6$d 張失敗。改寫了 %7$d 個來源。還有 %8$d 張等待轉換。"
