PLG_TASK_MEDIAAUDIT_LOCALIZE_LIMIT_DESC="其餘的留到下次執行。如果排程是靠訪客瀏覽觸發而不是 cron，請設小一點。"
PLG_TASK_MEDIAAUDIT_CHECK_EXTERNAL="檢查外部圖片"
